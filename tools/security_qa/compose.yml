services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${SECURITY_E2E_DB_PORT:-25432}:5432"
    volumes:
      - security_e2e_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  db-migrate:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    env_file:
      - ${SECURITY_E2E_ENV_FILE}
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_URL: redis://redis:6379
      ASSET_UPLOAD_DIR: /app/apps/api/uploads/assets
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sh", "-c", "pnpm db:migrate"]

  seed:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    env_file:
      - ${SECURITY_E2E_ENV_FILE}
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_URL: redis://redis:6379
      ASSET_UPLOAD_DIR: /app/apps/api/uploads/assets
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    command: ["sh", "-c", "pnpm db:seed"]

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    env_file:
      - ${SECURITY_E2E_ENV_FILE}
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_URL: redis://redis:6379
      ASSET_UPLOAD_DIR: /app/apps/api/uploads/assets
    ports:
      - "${SECURITY_E2E_API_PORT:-23000}:3000"
    volumes:
      - security_e2e_uploads:/app/apps/api/uploads/assets
    depends_on:
      seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    environment:
      DEV_API_PROXY_TARGET: http://api:3000
      VITE_API_BASE_URL: /api
    ports:
      - "${SECURITY_E2E_WEB_PORT:-25173}:5173"
    depends_on:
      api:
        condition: service_started

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${SECURITY_E2E_APP_PORT:-28080}:80"
    volumes:
      - ../../infra/docker/nginx/api.conf:/etc/nginx/conf.d/api.conf:ro
      - ../../infra/docker/nginx/web.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      web:
        condition: service_started
      api:
        condition: service_started

volumes:
  security_e2e_postgres:
  security_e2e_uploads:

services:
  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    env_file:
      - ../../.env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      REDIS_URL: redis://redis:6379
    expose:
      - '3000'
    depends_on:
      - postgres
      - redis
    logging:
      driver: json-file
      options:
        max-size: ${API_LOG_MAX_SIZE:-20m}
        max-file: ${API_LOG_MAX_FILES:-10}
  db-migrate:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    profiles:
      - maintenance
    env_file:
      - ../../.env
    environment:
      POSTGRES_HOST: postgres
      MIGRATION_MAINTENANCE_WINDOW: ${MIGRATION_MAINTENANCE_WINDOW:?Set MIGRATION_MAINTENANCE_WINDOW=approved for the scheduled maintenance window}
      MIGRATION_REHEARSAL_COMPLETED: ${MIGRATION_REHEARSAL_COMPLETED:?Set MIGRATION_REHEARSAL_COMPLETED=approved after staging rehearsal}
      MIGRATION_RESPONSE_REVIEW_EXPLAIN_VERIFIED: ${MIGRATION_RESPONSE_REVIEW_EXPLAIN_VERIFIED:?Set MIGRATION_RESPONSE_REVIEW_EXPLAIN_VERIFIED=approved after reviewing EXPLAIN}
      MIGRATION_0024_CUTOVER_APPROVED: ${MIGRATION_0024_CUTOVER_APPROVED:?Set MIGRATION_0024_CUTOVER_APPROVED=approved for the approved 0024 cutover}
      MIGRATION_0024_PHASE: ${MIGRATION_0024_PHASE:?Set MIGRATION_0024_PHASE to the current 0024 phase}
      CUTOVER_EVIDENCE_DIR: /var/lib/0024-cutover
      MIGRATION_0024_BACKUP_PATH: ${MIGRATION_0024_BACKUP_PATH:-}
      MIGRATION_0024_RECONCILIATION_EVIDENCE: ${MIGRATION_0024_RECONCILIATION_EVIDENCE:-}
      MIGRATION_0024_SMOKE_URL: ${MIGRATION_0024_SMOKE_URL:-}
    volumes:
      - survey_0024_cutover_evidence:/var/lib/0024-cutover
    depends_on:
      - postgres
    restart: "no"
    command:
      - /bin/bash
      - /app/infra/scripts/db-migrate.sh
      - --staged
      - --maintenance-window
      - --rehearsed
      - --review-query-explained
      - --0024-phase
  survey-image-cleanup:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    profiles:
      - retention
    env_file:
      - ../../.env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      REDIS_URL: redis://redis:6379
      SURVEY_IMAGE_CLEANUP_ENABLED: ${SURVEY_IMAGE_CLEANUP_ENABLED:-false}
      SURVEY_IMAGE_CLEANUP_CADENCE_SECONDS: ${SURVEY_IMAGE_CLEANUP_CADENCE_SECONDS:-900}
      SURVEY_IMAGE_CLEANUP_BATCH_SIZE: ${SURVEY_IMAGE_CLEANUP_BATCH_SIZE:-25}
      SURVEY_IMAGE_CLEANUP_GRACE_MS: ${SURVEY_IMAGE_CLEANUP_GRACE_MS:-3600000}
      SURVEY_IMAGE_CLEANUP_ALERT_OWNER: ${SURVEY_IMAGE_CLEANUP_ALERT_OWNER:-}
      SURVEY_IMAGE_CLEANUP_ALERT_SINK: ${SURVEY_IMAGE_CLEANUP_ALERT_SINK:-}
    depends_on:
      - postgres
      - redis
    restart: "no"
    command:
      - /bin/bash
      - -ec
      - |
        if [ "$$SURVEY_IMAGE_CLEANUP_ENABLED" != 'true' ]; then
          printf '%s\n' '{"event":"survey_image_cleanup_scheduler_disabled","error":"survey_image_cleanup_not_enabled"}' >&2
          exit 1
        fi
        if [ -z "$$SURVEY_IMAGE_CLEANUP_ALERT_OWNER" ] || [ -z "$$SURVEY_IMAGE_CLEANUP_ALERT_SINK" ]; then
          printf '%s\n' '{"event":"survey_image_cleanup_scheduler_configuration_failed","error":"survey_image_cleanup_alert_configuration_required"}' >&2
          exit 1
        fi
        case "$$SURVEY_IMAGE_CLEANUP_ALERT_SINK" in http://*|https://*) ;; *) printf '%s\n' '{"event":"survey_image_cleanup_scheduler_configuration_failed","error":"invalid_survey_image_cleanup_alert_sink"}' >&2; exit 1 ;; esac
        if [ "$$SURVEY_IMAGE_CLEANUP_CADENCE_SECONDS" != '900' ] || [ "$$SURVEY_IMAGE_CLEANUP_BATCH_SIZE" != '25' ] || [ "$$SURVEY_IMAGE_CLEANUP_GRACE_MS" != '3600000' ]; then
          printf '%s\n' '{"event":"survey_image_cleanup_scheduler_configuration_failed","error":"survey_image_cleanup_bounds_must_be_900_25_3600000"}' >&2
          exit 1
        fi
        alert() {
          SURVEY_IMAGE_CLEANUP_ALERT_EVENT="$$1" SURVEY_IMAGE_CLEANUP_ALERT_DETAIL="$$2" node -e '
            const payload = JSON.stringify({ event: process.env.SURVEY_IMAGE_CLEANUP_ALERT_EVENT, owner: process.env.SURVEY_IMAGE_CLEANUP_ALERT_OWNER, detail: process.env.SURVEY_IMAGE_CLEANUP_ALERT_DETAIL });
            fetch(process.env.SURVEY_IMAGE_CLEANUP_ALERT_SINK, { method: "POST", headers: { "content-type": "application/json" }, body: payload }).then((response) => {
              if (!response.ok) throw new Error(`alert_sink_http_$${response.status}`);
            }).catch((error) => { process.stderr.write(JSON.stringify({ event: "survey_image_cleanup_alert_delivery_failed", error: error.message }) + "\n"); process.exitCode = 1; });
          '
        }
        if ! pnpm --filter @soc/shared build; then
          alert survey_image_cleanup_runtime_prepare_failed runtime_prepare_failed
          exit 1
        fi
        while true; do
          if cleanup_output="$$(pnpm survey:images:cleanup -- "$$SURVEY_IMAGE_CLEANUP_BATCH_SIZE" "$$SURVEY_IMAGE_CLEANUP_GRACE_MS")"; then
            cleanup_line="$${cleanup_output##*$$'\n'}"
            if CLEANUP_LINE="$$cleanup_line" node -e '
              const result = JSON.parse(process.env.CLEANUP_LINE);
              if (result.ok !== true) throw new Error("invalid_cleanup_result");
              if (result.exhausted > 0 || result.claimed >= result.batchSize) process.exitCode = 2;
            '; then
              :
            else
              status=$$?
              if [ "$$status" -eq 2 ]; then alert survey_image_cleanup_backlog_detected cleanup_backlog_detected; else alert survey_image_cleanup_failed invalid_cleanup_result; fi
            fi
          else
            alert survey_image_cleanup_failed cleanup_command_failed
          fi
          sleep "$$((900 + $$(date +%s) % 61))"
        done
  survey-response-purge:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    profiles:
      - retention
    env_file:
      - ../../.env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      REDIS_URL: redis://redis:6379
      SURVEY_RESPONSE_PURGE_ENABLED: ${SURVEY_RESPONSE_PURGE_ENABLED:-false}
      SURVEY_RESPONSE_PURGE_CADENCE_SECONDS: ${SURVEY_RESPONSE_PURGE_CADENCE_SECONDS:-900}
      SURVEY_RESPONSE_PURGE_BATCH_SIZE: ${SURVEY_RESPONSE_PURGE_BATCH_SIZE:-100}
      SURVEY_RESPONSE_PURGE_ALERT_OWNER: ${SURVEY_RESPONSE_PURGE_ALERT_OWNER:-}
      SURVEY_RESPONSE_PURGE_ALERT_SINK: ${SURVEY_RESPONSE_PURGE_ALERT_SINK:-}
    volumes:
      - survey_response_purge_state:/var/lib/survey-response-purge
    depends_on:
      - postgres
      - redis
    restart: "no"
    command:
      - /bin/bash
      - -ec
      - |
        if [ "$$SURVEY_RESPONSE_PURGE_ENABLED" != 'true' ]; then
          printf '%s\n' '{"event":"survey_response_purge_scheduler_disabled","error":"survey_response_purge_not_enabled"}' >&2
          exit 1
        fi
        if [ -z "$$SURVEY_RESPONSE_PURGE_ALERT_OWNER" ] || [ -z "$$SURVEY_RESPONSE_PURGE_ALERT_SINK" ]; then
          printf '%s\n' '{"event":"survey_response_purge_scheduler_configuration_failed","error":"survey_response_purge_alert_configuration_required"}' >&2
          exit 1
        fi
        case "$$SURVEY_RESPONSE_PURGE_ALERT_SINK" in
          http://*|https://*) ;;
          *)
            printf '%s\n' '{"event":"survey_response_purge_scheduler_configuration_failed","error":"invalid_survey_response_purge_alert_sink"}' >&2
            exit 1
            ;;
        esac
        if [ "$$SURVEY_RESPONSE_PURGE_CADENCE_SECONDS" != '900' ]; then
          printf '%s\n' '{"event":"survey_response_purge_scheduler_configuration_failed","error":"survey_response_purge_cadence_must_be_900_seconds"}' >&2
          exit 1
        fi
        state_path=/var/lib/survey-response-purge/last-success.json
        alert() {
          SURVEY_RESPONSE_PURGE_ALERT_EVENT="$$1" SURVEY_RESPONSE_PURGE_ALERT_DETAIL="$$2" SURVEY_RESPONSE_PURGE_ALERT_STATE_PATH="$$state_path" node -e '
            const { readFileSync } = require("node:fs");
            let lastSuccessAt = null;
            try { lastSuccessAt = JSON.parse(readFileSync(process.env.SURVEY_RESPONSE_PURGE_ALERT_STATE_PATH, "utf8")).lastSuccessAt ?? null; } catch {}
            const payload = JSON.stringify({ event: process.env.SURVEY_RESPONSE_PURGE_ALERT_EVENT, owner: process.env.SURVEY_RESPONSE_PURGE_ALERT_OWNER, detail: process.env.SURVEY_RESPONSE_PURGE_ALERT_DETAIL, lastSuccessAt });
            fetch(process.env.SURVEY_RESPONSE_PURGE_ALERT_SINK, { method: "POST", headers: { "content-type": "application/json" }, body: payload }).then((response) => {
              if (!response.ok) throw new Error(`alert_sink_http_$${response.status}`);
            }).catch((error) => { process.stderr.write(JSON.stringify({ event: "survey_response_purge_alert_delivery_failed", error: error.message }) + "\n"); process.exitCode = 1; });
          '
        }
        if ! STATE_PATH="$$state_path" node -e '
          const { readFileSync } = require("node:fs");
          const timestamp = JSON.parse(readFileSync(process.env.STATE_PATH, "utf8")).lastSuccessAt;
          if (typeof timestamp !== "string" || !Number.isFinite(Date.parse(timestamp)) || Date.now() - Date.parse(timestamp) > 1800000) process.exitCode = 1;
        '; then
          alert survey_response_purge_no_success no_recent_success
        fi
        if ! pnpm --filter @soc/shared build; then
          alert survey_response_purge_runtime_prepare_failed runtime_prepare_failed
          exit 1
        fi
        while true; do
          if purge_output="$$(pnpm survey:purge)"; then
            purge_line="$${purge_output##*$$'\n'}"
            if PURGE_LINE="$$purge_line" STATE_PATH="$$state_path" node -e '
              const { writeFileSync } = require("node:fs");
              const result = JSON.parse(process.env.PURGE_LINE);
              if (result.ok !== true || typeof result.completedAt !== "string") throw new Error("invalid_purge_result");
              writeFileSync(process.env.STATE_PATH, JSON.stringify({ lastSuccessAt: result.completedAt }) + "\n", { mode: 0o600 });
              if (typeof result.backlogAgeSeconds === "number" && result.backlogAgeSeconds > 900) process.exitCode = 2;
            '; then
              :
            else
              status=$$?
              if [ "$$status" -eq 2 ]; then
                alert survey_response_purge_backlog_age_exceeded backlog_age_exceeded
              else
                alert survey_response_purge_failed invalid_purge_result
              fi
            fi
          else
            alert survey_response_purge_failed purge_command_failed
            if ! STATE_PATH="$$state_path" node -e '
              const { readFileSync } = require("node:fs");
              const timestamp = JSON.parse(readFileSync(process.env.STATE_PATH, "utf8")).lastSuccessAt;
              if (typeof timestamp !== "string" || Date.now() - Date.parse(timestamp) > 1800000) process.exitCode = 1;
            '; then
              alert survey_response_purge_no_success no_recent_success
            fi
          fi
          sleep "$$((900 + $$(date +%s) % 61))"
        done

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      args:
        VITE_ENABLE_DEVELOPMENT_LOGIN: 'false'
    env_file:
      - ../../.env
    expose:
      - '5173'
    depends_on:
      - api

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-soc_web}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data

  nginx:
    image: nginx:1.27-alpine
    ports:
      - '127.0.0.1:${NGINX_PORT:-8080}:80'
    volumes:
      - ./nginx/api.conf:/etc/nginx/conf.d/api.conf:ro
      - ./nginx/web.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
      - api

volumes:
  postgres_data:
  redis_data:
  survey_response_purge_state:
  survey_0024_cutover_evidence:

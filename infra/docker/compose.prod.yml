x-logging: &default-logging
  driver: json-file
  options:
    max-file: '3'
    max-size: 10m

services:
  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile.prod
    env_file:
      - ../../.env.production
    environment:
      NODE_ENV: production
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_URL: redis://redis:6379
      ASSET_UPLOAD_DIR: /app/apps/api/uploads/assets
      ASSET_ORPHAN_CLEANUP_ENABLED: ${ASSET_ORPHAN_CLEANUP_ENABLED:-false}
    expose:
      - '3000'
    init: true
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health').then(async (response) => { const body = await response.json(); if (!response.ok || body.status !== 'ok') process.exit(1); }).catch(() => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    volumes:
      - ../../apps/api/uploads:/app/apps/api/uploads
      - type: bind
        source: ../../secrets/google-calendar-service-account.json
        target: /run/secrets/google-calendar-service-account.json
        read_only: true
      - type: bind
        source: ../../secrets/google-oauth-client.json
        target: /run/secrets/google-oauth-client.json
        read_only: true
      - type: bind
        source: ../../secrets/google-oauth-token.json
        target: /run/secrets/google-oauth-token.json
        read_only: true
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile.prod
    expose:
      - '5173'
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:5173/ || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      api:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-soc_web}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$${POSTGRES_DB:-soc_web}"']
      interval: 5s
      timeout: 5s
      retries: 12

  db-migrate:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile.prod
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      ASSET_UPLOAD_DIR: /app/apps/api/uploads/assets
    volumes:
      - ../../apps/api/uploads:/app/apps/api/uploads
    logging: *default-logging
    command:
      [
        'sh',
        '-c',
        'pnpm db:migrate',
      ]

  redis:
    image: redis:7-alpine
    command: ['redis-server', '/usr/local/etc/redis/redis.conf']
    volumes:
      - redis_data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:1.27-alpine
    ports:
      - '127.0.0.1:${NGINX_PORT:-8080}:80'
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1/health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - ./nginx/api.conf:/etc/nginx/conf.d/api.conf:ro
      - ./nginx/web.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:

services:
  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile.dev
    env_file:
      - ${DEV_COMPOSE_ENV_FILE:-../../.env}
    environment:
      NODE_ENV: development
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-soc_web}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-soc_web}?sslmode=disable
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: redis://redis:6379
    ports:
      - '${API_PORT:-3000}:3000'
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "fetch('http://127.0.0.1:3000/health/ready').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    depends_on:
      db-seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile.dev
      args:
        VITE_ENABLE_DEVELOPMENT_LOGIN: 'true'
    env_file:
      - ${DEV_COMPOSE_ENV_FILE:-../../.env}
    environment:
      VITE_API_PROXY_TARGET: http://api:3000
    ports:
      - '${WEB_PORT:-5173}:8080'
    expose:
      - '8080'
    command: ['pnpm', 'dev', '--host', '0.0.0.0', '--port', '8080']
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    depends_on:
      api:
        condition: service_healthy

  postgres:
    image: postgres:16.8-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-soc_web}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - '${POSTGRES_HOST_PORT:-5432}:5432'
    volumes:
      - dev_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 12

  db-migrate:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile.dev
    working_dir: /app
    env_file:
      - ${DEV_COMPOSE_ENV_FILE:-../../.env}
    environment:
      NODE_ENV: development
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-soc_web}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-soc_web}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    command: ['pnpm', '--filter', '@soc/api', 'db:migrate']

  db-seed:
    image: postgres:16.8-alpine
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-soc_web}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./postgres/seed-development-user.sql:/seed-development-user.sql:ro
      - ./postgres/seed-development-content.sql:/seed-development-content.sql:ro
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    command: ['sh', '-ec', 'psql -v ON_ERROR_STOP=1 -f /seed-development-user.sql && psql -v ON_ERROR_STOP=1 -f /seed-development-content.sql']

  redis:
    image: redis:7.4.2-alpine
    command: ['redis-server', '/usr/local/etc/redis/redis.conf']
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - dev_redis_data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 12

  nginx:
    image: nginx:1.27.5-alpine
    ports:
      - '127.0.0.1:${NGINX_PORT:-8080}:80'
    volumes:
      - ./nginx/api.conf:/etc/nginx/conf.d/api.conf:ro
      - ./nginx/web.dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  dev_postgres_data:
  dev_redis_data:

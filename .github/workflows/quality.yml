name: Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: soc_web_test
          POSTGRES_PASSWORD: soc_test
          POSTGRES_USER: soc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U soc_test -d soc_web_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      CI: "true"
      TZ: Asia/Seoul
      DATABASE_URL: postgresql://soc_test:soc_test@localhost:5432/soc_web_test
      ASSET_QUOTA_TEST_DATABASE_URL: postgresql://soc_test:soc_test@localhost:5432/soc_web_test
      FEE_CONCURRENCY_TEST_DATABASE_URL: postgresql://soc_test:soc_test@localhost:5432/soc_web_test
      GOOGLE_QUEUE_FENCING_TEST_DATABASE_URL: postgresql://soc_test:soc_test@localhost:5432/soc_web_test
      NODE_ENV: test
      POSTGRES_DB: soc_web_test
      POSTGRES_HOST: localhost
      POSTGRES_PASSWORD: soc_test
      POSTGRES_PORT: 5432
      POSTGRES_USER: soc_test
      SURVEY_CONCURRENCY_TEST_DATABASE_URL: postgresql://soc_test:soc_test@localhost:5432/soc_web_test
      VOTE_CONCURRENCY_TEST_DATABASE_URL: postgresql://soc_test:soc_test@localhost:5432/soc_web_test

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          cache: pnpm
          node-version: 24.14.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply database migrations
        run: pnpm --filter @soc/api db:migrate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test with PostgreSQL concurrency coverage
        run: pnpm test

      - name: Build production bundles
        run: pnpm build

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          cache: pnpm
          node-version: 24.14.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Secret, lockfile, and container policy scan
        run: node tools/security/verify-supply-chain.mjs

      - name: Dependency vulnerability scan
        run: pnpm audit --prod --json

      - name: Build API production image for scanning
        run: docker build --target runtime --tag soc-web-api:ci --file apps/api/Dockerfile.prod .

      - name: Scan API container and filesystem
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: soc-web-api:ci
          format: table
          ignore-unfixed: true
          scanners: vuln,secret,misconfig
          vuln-type: os,library
          exit-code: '1'

      - name: Secret history scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

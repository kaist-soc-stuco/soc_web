services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_URL: redis://redis:6379
      ASSET_UPLOAD_DIR: /app/apps/api/uploads/assets
    ports:
      - '${API_PORT}:3000'
    volumes:
      - ./apps/api/uploads:/app/apps/api/uploads
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    env_file:
      - .env
    environment:
      DEV_API_PROXY_TARGET: http://api:3000
    ports:
      - '${WEB_PORT}:5173'
    depends_on:
      api:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    ports:
      - '${POSTGRES_PORT}:5432'
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 12

  db-migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      ASSET_UPLOAD_DIR: /app/apps/api/uploads/assets
    volumes:
      - ./apps/api/uploads:/app/apps/api/uploads
    command: ['sh', '-c', 'pnpm db:migrate']

  redis:
    image: redis:7-alpine
    command: ['redis-server', '/usr/local/etc/redis/redis.conf']
    volumes:
      - redis_data:/data
      - ./infra/docker/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro

  nginx:
    image: nginx:1.27-alpine
    ports:
      - '127.0.0.1:${NGINX_PORT}:80'
    volumes:
      - ./infra/docker/nginx/api.conf:/etc/nginx/conf.d/api.conf:ro
      - ./infra/docker/nginx/web.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      web:
        condition: service_started
      api:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
